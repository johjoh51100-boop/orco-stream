<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Orco Stream est une plateforme moderne pour découvrir des en avec une interface rapide, fluide et intuitive.">
    <title>Orco Stream - Regardez vos films et séries animes en streaming</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg-body: #050508;
            --sidebar-width: 80px;
            --accent: #00f2fe;
            --highlight: #4facfe;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --glass-bg: rgba(18, 22, 36, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(20px) saturate(180%);
            --shadow-glass: 0 20px 50px rgba(0, 0, 0, 0.7);
            --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
           position: absolute;
           left: -9999px;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        body.cinema-mode {
            background-color: #000;
        }

        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 30% 20%, rgba(0, 242, 254, 0.06), transparent 40%),
                radial-gradient(circle at 80% 60%, rgba(79, 172, 254, 0.05), transparent 40%),
                radial-gradient(circle at 10% 80%, rgba(139, 92, 246, 0.04), transparent 40%);
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        body.cinema-mode::before {
            opacity: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 0;
            background: rgba(8, 10, 16, 0.6);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--glass-border);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        body.cinema-mode .sidebar {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-100%);
        }

        .sidebar-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--highlight));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transition: var(--transition);
        }

        .sidebar-logo:hover {
            transform: scale(1.08);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            border: none;
            position: relative;
        }
        
        .nav-icon-btn:hover::after {
            content: attr(data-title);
            position: absolute;
            left: 60px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid var(--accent);
            z-index: 1000;
        }

        .nav-icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-icon-btn:hover, .nav-icon-btn.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-icon-btn.active {
            color: var(--accent);
            box-shadow: inset 0 0 12px rgba(0, 242, 254, 0.15);
        }

        .sidebar-user {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--glass-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--accent);
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.5s ease, width 0.5s ease;
        }

        body.cinema-mode .main-wrapper {
            margin-left: 0;
            width: 100%;
        }

        header.top-bar {
            padding: 20px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 8, 0.7);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        body.cinema-mode header.top-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-100%);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        .search-input {
            width: 100%;
            padding: 12px 46px 12px 46px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .search-input:focus {
            background: rgba(0, 242, 254, 0.05);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 14px;
            pointer-events: none;
        }

        .mic-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
        }

        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(8, 10, 16, 0.95);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-results-dropdown.active {
            display: block;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: var(--transition);
        }

        .search-result-item:hover {
            background: rgba(0, 242, 254, 0.1);
        }

        .search-result-item img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .search-result-title {
            font-size: 14px;
            font-weight: 700;
            flex-grow: 1;
        }
        
        .search-result-genre {
            font-size: 10px;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent);
        }

        .search-history-header {
            padding: 10px 12px;
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 900;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }
        
        .search-history-clear {
            cursor: pointer;
            color: var(--text-sub);
        }

        .search-history-clear:hover {
            color: #ff4757;
        }

        main {
            padding: 30px 50px 60px 50px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        body.cinema-mode main {
            padding-top: 0;
            padding-left: 0;
            padding-right: 0;
            max-width: 100%;
        }

        .page-view {
            display: none;
            animation: viewEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .active-view { display: block; }

        .hero-banner {
            position: relative;
            width: 100%;
            height: 420px;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 45px;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65) contrast(1.1);
            transform: scale(1.02);
            transition: transform 10s ease;
        }

        .hero-banner:hover .hero-bg {
            transform: scale(1.06);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 5, 8, 0.1) 0%, rgba(5, 5, 8, 0.8) 60%, rgba(5, 5, 8, 0.98) 100%),
                        linear-gradient(90deg, rgba(5, 5, 8, 0.9) 0%, rgba(5, 5, 8, 0.4) 50%, transparent 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hero-tag {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-tag::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .hero-title {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .meta-rating {
            color: #facc15;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .meta-badge {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--highlight));
            color: #000;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 242, 254, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title span.kanji {
            font-size: 13px;
            color: var(--accent);
            font-weight: 900;
            opacity: 0.8;
        }

        .catalog-filters {
            display: flex;
            gap: 10px;
        }

        .filter-select, .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .filter-select {
            appearance: none;
            padding-right: 30px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
        }

        .filter-select option {
            background-color: #080a10;
            color: #ffffff;
        }

        .filter-btn:hover, .filter-select:hover {
            border-color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .genres-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 45px;
        }

        .genre-card {
            height: 95px;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            display: flex;
            align-items: flex-end;
            padding: 15px;
        }

        .genre-card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5);
            transition: transform 0.5s ease;
        }

        .genre-card:hover img {
            transform: scale(1.15);
            filter: brightness(0.7);
        }

        .genre-card span {
            position: relative;
            z-index: 2;
            font-weight: 800;
            font-size: 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .genre-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
        }

        .resume-banner {
            border-radius: 20px;
            padding: 20px 28px;
            margin-bottom: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
        }

        .resume-banner:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,242,254,0.1);
        }

        .resume-info { display: flex; flex-direction: column; gap: 6px; }
        .resume-badge { background: var(--accent); color: #000; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; width: max-content; }
        .resume-title { font-size: 18px; font-weight: 800; }
        .resume-ep { color: var(--text-sub); font-size: 13px; font-weight: 600; }
        .resume-play { background: #fff; color: #000; width: 48px; height: 48px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; padding-left: 3px; box-shadow: 0 8px 20px rgba(255,255,255,0.2); transition: var(--transition); }
        .resume-banner:hover .resume-play { transform: scale(1.1); box-shadow: 0 10px 25px rgba(255,255,255,0.4); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
        }

        .grid.list-view .card {
            display: flex;
            flex-direction: row;
            height: 120px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.15);
            border-color: var(--accent);
        }

        .grid.list-view .card:hover {
            transform: translateX(8px);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%;
            overflow: hidden;
        }

        .grid.list-view .card-img-wrapper {
            width: 85px;
            padding-top: 0;
            height: 100%;
            flex-shrink: 0;
        }

        .card img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img { transform: scale(1.08); }

        .card-content {
            padding: 12px 10px;
            background: linear-gradient(to top, rgba(5,5,8,0.98) 0%, rgba(5,5,8,0.7) 60%, transparent 100%);
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .grid.list-view .card-content {
            position: relative;
            background: transparent;
            width: 100%;
            align-items: center;
            padding: 0 20px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 80%;
        }

        .grid.list-view .card-title {
            font-size: 16px;
        }
        
        .card-tooltip {
            position: absolute;
            bottom: 100%; left: 0; width: 250px;
            background: rgba(0,0,0,0.95);
            border: 1px solid var(--accent);
            color: white; padding: 12px; border-radius: 12px;
            font-size: 12px; font-weight: 500; line-height: 1.5;
            opacity: 0; pointer-events: none; transform: translateY(10px);
            transition: var(--transition); z-index: 50;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        
        .card:hover .card-tooltip {
            opacity: 1; transform: translateY(-10px);
        }

        .grid.list-view .card-tooltip {
            display: none;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--accent);
            z-index: 10;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            transition: var(--transition);
        }

        .fav-btn:hover {
            color: #ff4757;
            transform: scale(1.2);
        }
        
        .fav-btn.active {
            color: #ff4757;
        }

        .fav-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .btn-back {
            background: rgba(255,255,255,0.03); color: var(--text-sub); border: 1px solid var(--glass-border);
            padding: 12px 24px; border-radius: 30px; cursor: pointer; margin-bottom: 30px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 8px; transition: var(--transition); backdrop-filter: blur(10px);
            font-size: 13px;
        }

        .btn-back:hover { background: var(--accent); color: #000; border-color: transparent; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); transform: translateX(-4px); }

        .anime-detail-header { display: flex; gap: 40px; margin-bottom: 40px; padding: 35px; border-radius: 24px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); position: relative; overflow: hidden; }
        .anime-detail-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.2) blur(10px); z-index: 0; }
        .detail-poster { width: 250px; border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); flex-shrink: 0; border: 1px solid var(--glass-border); position: relative; z-index: 1; }
        .anime-info { position: relative; z-index: 1; }

    <script>
        function setCookie(name, value, days = 365) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + encodeURIComponent(value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }

        function getArrayFromCookie(name) {
            const val = getCookie(name);
            if (!val) return [];
            try { return JSON.parse(val); } catch(e) { return []; }
        }

        function saveArrayToCookie(name, arr) {
            setCookie(name, JSON.stringify(arr));
        }

        function getAnime(id) { return database.find(a => a.id === id) || null; }

        function getItem(anime, context) {
            if (!anime) return null;
            if (context.type === 'film') {
                return (anime.films && anime.films[context.itemIndex]) ? anime.films[context.itemIndex] : null;
            }
            const season = (anime.seasons && anime.seasons[context.index]) ? anime.seasons[context.index] : null;
            return (season && season.episodes && season.episodes[context.itemIndex]) ? season.episodes[context.itemIndex] : null;
        }

        function hasLang(item, lang) {
            if (!item || !item[lang]) return false;
            const l = item[lang];
            if (typeof l === 'string') return l.trim() !== '';
            return Boolean((l.sibnet && l.sibnet.trim()) || (l.vidmoly && l.vidmoly.trim()));
        }

        function hasServer(item, lang, server) {
            if (!hasLang(item, lang)) return false;
            const l = item[lang];
            if (typeof l === 'string') return server === 'sibnet' && l.trim() !== '';
            return Boolean(l[server] && l[server].trim() !== '');
        }

        function checkAnimeLangGlobal(anime, lang) {
            let hasIt = false;
            if (anime.seasons) {
                anime.seasons.forEach(s => {
                    if (s.episodes) s.episodes.forEach(e => { if(hasLang(e, lang)) hasIt = true; });
                });
            }
            if (anime.films) {

        function toggleFilter(type) {
            catalogFilters[type] = !catalogFilters[type];
            document.getElementById(`filter-${type}`).classList.toggle('active', catalogFilters[type]);
            resetPaginationAndApply();
        }

        function resetPaginationAndApply() {
            catalogPage = 1;
            applyCatalogFilters();
        }

        const workerCode = `
            self.onmessage = function(e) {
                const { db, filters, page, itemsPerPage } = e.data;
                let filtered = [...db];
                if (filters.vf) filtered = filtered.filter(a => JSON.stringify(a).includes('"vf"'));
                if (filters.vostfr) filtered = filtered.filter(a => JSON.stringify(a).includes('"vostfr"'));
                if (filters.sort === 'az') filtered.sort((a, b) => a.title.localeCompare(b.title));
                else if (filters.sort === 'za') filtered.sort((a, b) => b.title.localeCompare(a.title));
                const totalPages = Math.ceil(filtered.length / itemsPerPage);
                const start = (page - 1) * itemsPerPage;
                const paginated = filtered.slice(start, start + itemsPerPage);
                self.postMessage({ items: paginated, totalPages, page });
            };
        `;
        const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
        const catalogWorker = new Worker(URL.createObjectURL(workerBlob));

        catalogWorker.onmessage = function(e) {
            const { items, totalPages, page } = e.data;
            const grid = document.getElementById('catalog-grid');
            if (items.length === 0) {
                grid.innerHTML = "<p style='color: var(--text-sub)'>Aucun résultat pour ces critères.</p>";
                document.getElementById('pagination-controls').innerHTML = '';
                return;
            }
            grid.innerHTML = items.map(anime => generateAnimeCard(anime)).join('');
            renderPaginationControls(totalPages, page);
        };

        function applyCatalogFilters() {
            catalogFilters.sort = document.getElementById('sort-select').value;
            catalogWorker.postMessage({ db: database, filters: catalogFilters, page: catalogPage, itemsPerPage: catalogItemsPerPage });
        }

        function renderPaginationControls(totalPages, currentPage) {
            const container = document.getElementById('pagination-controls');
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToCatalogPage(${i})">${i}</button>`;
            }
            container.innerHTML = html;
        }

        function goToCatalogPage(page) {
            catalogPage = page;
            applyCatalogFilters();
            document.getElementById('view-catalog').scrollIntoView();
        }

        function renderAnimeDetail() {
            const anime = getAnime(currentAnimeId);
            const container = document.getElementById('anime-detail-content');
            if (!anime) { container.innerHTML = "<p>Erreur d'affichage</p>"; return; }

            if (anime.seasons) {
                anime.seasons.forEach((s, idx) => {
                    const id = `s-${idx}`;
                    tabsHtml += `<button class="tab-btn ${activeTabId === id ? 'active' : ''}" onclick="switchTab('${id}')">Saison ${s.season_number}</button>`;
                });
            }
            if (anime.films && anime.films.length > 0) {
                tabsHtml += `<button class="tab-btn ${activeTabId === 'films' ? 'active' : ''}" onclick="switchTab('films')">Films</button>`;
            }
            container.innerHTML = `
                <div class="anime-detail-header">
                    <img src="${anime.image || ''}" class="anime-detail-bg" alt="">

                    <div class="anime-info">

                        <div class="anime-actions-row">
                            <button class="btn-secondary" onclick="toggleFavoriteEvent(event, '${anime.id}')">${isFavorite(anime.id) ? '♥ Retirer Favori' : '♡ Favori'}</button>
                            <button class="btn-secondary" onclick="toggleWatchLaterEvent(event, '${anime.id}')">${isWatchLater(anime.id) ? '✓ Dans la liste' : '+ À regarder'}</button>

        function switchTab(tabId) {
            activeTabId = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderEpisodesList();
        }

        function renderEpisodesList() {
            const anime = getAnime(currentAnimeId);
            const container = document.getElementById('episodes-container');
            if (!anime) return;
            let items = [];
            let contextType = 'season';
            let sIndex = 0;
            if (activeTabId === 'films') {
                items = anime.films || [];
                contextType = 'film';
            } else {
                sIndex = parseInt(activeTabId.split('-')[1]);
                if (anime.seasons && anime.seasons[sIndex]) items = anime.seasons[sIndex].episodes || [];
            }
            if (items.length === 0) {
                container.innerHTML = "<p style='color:var(--text-sub)'>Aucun contenu disponible.</p>";
                return;
            }
            container.innerHTML = items.map((item, index) => {
                const ctx = { type: contextType, index: sIndex, itemIndex: index };
                const isWatched = isEpisodeWatched(currentAnimeId, ctx);
                let badges = '';
                if(hasLang(item, 'vf')) badges += '<span class="badge vf">VF</span>';
                if(hasLang(item, 'vostfr')) badges += '<span class="badge vostfr">VOSTFR</span>';
                return `
                    <div class="episode-card ${isWatched ? 'watched' : ''}" onclick="launchPlayer('${contextType}', ${sIndex}, ${index})">
                        <div class="ep-info">
                            <span class="ep-num">${contextType === 'film' ? 'Film' : 'Épisode'} ${item.number || (index+1)}</span>
                            <span class="ep-title">${item.title || ''}</span>
                        </div>
                        <div class="badges-container">${badges}</div>
                    </div>
                `;
            }).join('');
        }

        function launchPlayer(type, sIndex, itemIndex) {
            playerContext = { type, index: sIndex, itemIndex };
            const anime = getAnime(currentAnimeId);
            const item = getItem(anime, playerContext);
            if(hasLang(item, 'vf')) playerLang = 'vf';
            else if(hasLang(item, 'vostfr')) playerLang = 'vostfr';
            playerServer = 'sibnet';
            if(!hasServer(item, playerLang, 'sibnet')) playerServer = 'vidmoly';
            router.player();
        }

        function clearAllTimers() {
            activeTimers.forEach(t => clearTimeout(t));
            activeTimers = [];
        }

        function setupDynamicPlayerEvents() {
            clearAllTimers();
            const btnIntro = document.getElementById('skip-intro-btn');
            const btnOutro = document.getElementById('skip-outro-btn');
            const btnNext = document.getElementById('next-ep-popup');
            
            btnIntro.classList.remove('show');
            btnOutro.classList.remove('show');
            btnNext.classList.remove('show');
            
            activeTimers.push(setTimeout(() => btnIntro.classList.add('show'), 5000));
            activeTimers.push(setTimeout(() => btnIntro.classList.remove('show'), 85000));
            
            activeTimers.push(setTimeout(() => {
                btnOutro.classList.add('show');
                btnNext.classList.add('show');
            }, 1200000));
            
            activeTimers.push(setTimeout(() => {
                btnNext.classList.remove('show');
                navigateEpisode(1);
            }, 1320000));
        }

        function hideDynamicButton(id) {
            document.getElementById(id).classList.remove('show');
        }

        function loadPlayerContent() {
            clearAllTimers();
            const anime = getAnime(currentAnimeId);
            const item = getItem(anime, playerContext);
            if (!anime || !item) { router.home(); return; }
            markEpisodeWatched(currentAnimeId, playerContext);
            addToHistory(currentAnimeId);
            saveProgress();
            const labelStr = playerContext.type === 'film' 
                ? `Film ${item.number || (playerContext.itemIndex + 1)}`
                : `Saison ${anime.seasons[playerContext.index].season_number} • Épisode ${item.number || (playerContext.itemIndex + 1)}`;
            document.getElementById('player-anime-name').innerText = anime.title;
            document.getElementById('player-ep-info').innerText = `${labelStr} - ${item.title || ''}`;
            const iframe = document.getElementById('video-iframe');
            
            iframe.onerror = function() {
                showToast("Lien vidéo mort détecté. Passage au serveur alternatif...");
                switchServer(playerServer === 'sibnet' ? 'vidmoly' : 'sibnet');
            };

            let src = '';
            if (item[playerLang]) {
                if (typeof item[playerLang] === 'string') src = item[playerLang];
                else if (item[playerLang][playerServer]) src = item[playerLang][playerServer];
                else src = item[playerLang].sibnet || item[playerLang].vidmoly || '';
            }
            if (playerServer === 'sibnet') {
                let id = src.includes('sibnet') ? src.replace(/\D/g,'') : src;
                src = `https://video.sibnet.ru/shell.php?videoid=${id}`;
            } else if (playerServer === 'vidmoly') {
                let id = src.includes('vidmoly') ? src.split('-').pop().replace('.html','') : src;
                src = `https://vidmoly.biz/embed-${id}.html`;
            }
            iframe.src = src || '';
            updatePlayerControls(anime, item);
            buildPlayerNav(anime);
            setupDynamicPlayerEvents();
        }

        function updatePlayerControls(anime, item) {
            document.getElementById('lang-vf').disabled = !hasLang(item, 'vf');
            document.getElementById('lang-vostfr').disabled = !hasLang(item, 'vostfr');
            document.getElementById('lang-vf').classList.toggle('active', playerLang === 'vf');
            document.getElementById('lang-vostfr').classList.toggle('active', playerLang === 'vostfr');
            document.getElementById('server-sibnet').disabled = !hasServer(item, playerLang, 'sibnet');
            document.getElementById('server-vidmoly').disabled = !hasServer(item, playerLang, 'vidmoly');
            document.getElementById('server-sibnet').classList.toggle('active', playerServer === 'sibnet');
            document.getElementById('server-vidmoly').classList.toggle('active', playerServer === 'vidmoly');
            let hasPrev = playerContext.itemIndex > 0;
            let hasNext = false;
            if (playerContext.type === 'film') {
                hasNext = playerContext.itemIndex < (anime.films.length - 1);
            } else {
                const s = anime.seasons[playerContext.index];
                hasNext = playerContext.itemIndex < (s.episodes.length - 1);
            }
            document.getElementById('btn-prev').disabled = !hasPrev;
            document.getElementById('btn-next').disabled = !hasNext;
        }

        function buildPlayerNav(anime) {
            let catHtml = '';
            if(anime.seasons) {
                anime.seasons.forEach((s, i) => {
                    catHtml += `<button class="pill ${playerContext.type === 'season' && playerContext.index === i ? 'active' : ''}" onclick="changePlayerCategory('season', ${i})">Saison ${s.season_number}</button>`;
                });
            }
            if(anime.films && anime.films.length > 0) {
                catHtml += `<button class="pill ${playerContext.type === 'film' ? 'active' : ''}" onclick="changePlayerCategory('film', 0)">Films</button>`;
            }
            document.getElementById('player-cat-pills').innerHTML = catHtml;
            document.getElementById('label-cat').innerText = playerContext.type === 'season' ? 'Saison' : 'Catégorie';
            let itemsHtml = '';
            let items = playerContext.type === 'film' ? anime.films : anime.seasons[playerContext.index].episodes;
            items.forEach((item, i) => {
                itemsHtml += `<button class="pill ${playerContext.itemIndex === i ? 'active' : ''}" onclick="changePlayerItem(${i})">${item.number || (i+1)}</button>`;
            });
            document.getElementById('player-item-pills').innerHTML = itemsHtml;
        }

        function changePlayerCategory(type, index) {
            playerContext.type = type;
            playerContext.index = index;
            playerContext.itemIndex = 0;
            const anime = getAnime(currentAnimeId);
            const item = getItem(anime, playerContext);
            if(!hasLang(item, playerLang)) playerLang = hasLang(item, 'vf') ? 'vf' : 'vostfr';
            loadPlayerContent();
        }

        function changePlayerItem(index) {
            playerContext.itemIndex = index;
            const anime = getAnime(currentAnimeId);
            const item = getItem(anime, playerContext);
            if(!hasLang(item, playerLang)) playerLang = hasLang(item, 'vf') ? 'vf' : 'vostfr';
            loadPlayerContent();
        }

        function navigateEpisode(dir) {
            const anime = getAnime(currentAnimeId);
            let items = playerContext.type === 'film' ? anime.films : anime.seasons[playerContext.index].episodes;
            const newIndex = playerContext.itemIndex + dir;
            if (newIndex >= 0 && newIndex < items.length) {
                changePlayerItem(newIndex);
            } else {
                hideDynamicButton('next-ep-popup');
            }
        }

        function switchLang(lang) {
            playerLang = lang;
            const item = getItem(getAnime(currentAnimeId), playerContext);
            if (!hasServer(item, playerLang, playerServer)) {
                playerServer = playerServer === 'sibnet' ? 'vidmoly' : 'sibnet';
            }
            loadPlayerContent();
        }

        function switchServer(server) {
            playerServer = server;
            loadPlayerContent();
        }

        const router = {
            hideAll: () => {
                document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active-view'));
                document.querySelectorAll('.nav-icon-btn').forEach(btn => btn.classList.remove('active'));
            },
            home: () => {
                router.hideAll();
                document.getElementById('view-home').classList.add('active-view');
                document.getElementById('nav-home').classList.add('active');
                renderHeroBanner();
                renderResumeBanner();
                renderHomeGrid();
                renderGenresGrid();
            },
            catalog: () => {
                router.hideAll();
                document.getElementById('view-catalog').classList.add('active-view');
                if (isListView) document.getElementById('catalog-grid').classList.add('list-view');
                resetPaginationAndApply();
            },
            favorites: () => {
                router.hideAll();
                document.getElementById('view-favorites').classList.add('active-view');
                document.getElementById('nav-favs').classList.add('active');
                if (isListView) document.getElementById('favorites-grid').classList.add('list-view');
                renderFavoritesGrid();
            },
            watchLater: () => {
                router.hideAll();
                document.getElementById('view-watchlater').classList.add('active-view');
                document.getElementById('nav-watchlater').classList.add('active');
                if (isListView) document.getElementById('watchlater-grid').classList.add('list-view');
                renderWatchLaterGrid();
            },
            history: () => {
                router.hideAll();
                document.getElementById('view-history').classList.add('active-view');
                document.getElementById('nav-history').classList.add('active');
                if (isListView) document.getElementById('history-grid').classList.add('list-view');
                renderHistoryGrid();
            },
            anime: (id) => {
                currentAnimeId = id;
                activeTabId = 's-0';
                router.hideAll();
                document.getElementById('view-anime').classList.add('active-view');
                renderAnimeDetail();
                window.scrollTo(0,0);
            },
            player: () => {
                router.hideAll();
                document.getElementById('view-player').classList.add('active-view');
                loadPlayerContent();
                window.scrollTo(0,0);
            }
        };

        document.getElementById('player-to-anime-btn').addEventListener('click', () => {
            document.getElementById('video-iframe').src = '';
            clearAllTimers();
            router.anime(currentAnimeId);
        });

        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            const menu = document.getElementById('custom-context-menu');
            menu.style.display = 'flex';
            menu.style.left = `${e.pageX}px`;
            menu.style.top = `${e.pageY}px`;
        });

        document.addEventListener('click', () => {
            document.getElementById('custom-context-menu').style.display = 'none';
        });

        function openSettingsModal() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettingsModal(e) {
            if (e.target.id === 'settings-modal') {
                document.getElementById('settings-modal').style.display = 'none';
            }
        }

        function applyThemeColor(color) {
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--highlight', color);
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            event.target.classList.add('active');
            showToast("Couleur modifiée avec succès");
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                recognition.start();
                showToast("Écoute en cours...");
                recognition.onresult = function(event) {
                    const query = event.results[0][0].transcript;
                    document.getElementById('search-input').value = query;
                    handleSearchDropdown(query);
                };
                recognition.onerror = function() {
                    showToast("Erreur de reconnaissance vocale.");
                };
            } else {
                showToast("Recherche vocale non supportée sur ce navigateur.");
            }
        }

        window.onload = () => {
            router.home();
        };
    </script>
</body>
</html>
