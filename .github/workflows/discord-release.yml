name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send custom Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          # 1. Utiliser Python pour générer un fichier JSON propre avec le message formaté
          python3 -c '
          import os, json

          tag = os.environ["TAG"]
          name = os.environ["NAME"]
          body = os.environ["BODY"]
          url = os.environ["URL"]

          message = f"🚀 **Nouvelle mise à jour : {name} ({tag})**\n\n**Ajout de :**\n{body}\n\n👉 [Lien de la release]({url})"

          payload = {"content": message}
          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          '

          # 2. Envoyer le fichier via curl
          curl -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"
